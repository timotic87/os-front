<!-- Upload dugme - samo kad nema aktivnog dokumenta i nije readonly -->
<div class="pb-3">
  <button
    *ngIf="!activeDocument && !readonly"
    (click)="openFileExplorer(fileInput)"
    class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#386097] hover:bg-[#386097]/90 dark:bg-[#56BDED] dark:hover:bg-[#56BDED]/90 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    Add {{ type }} document
  </button>
  <input type="file" #fileInput accept="application/pdf" style="display: none;" (change)="onFileSelected($event)">

  <!-- Aktivni dokument - sakrij kad je readonly -->
  <div *ngIf="activeDocument && !readonly" class="grid grid-cols-1 gap-3" [class.grid-cols-3]="approval" [class.lg:grid-cols-3]="approval">

    <!-- Document kartica -->
    <div class="rounded-lg shadow-sm border border-border bg-card p-4">
      <div class="flex items-start gap-3 mb-4">
        <div class="p-2 bg-blue-50 dark:bg-blue-900/20 rounded-lg flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-blue-600 dark:text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="font-medium text-sm text-foreground mb-1 leading-5 truncate">{{ activeDocument.fileName }}</h3>
          <div class="flex items-center gap-2 text-xs text-muted-foreground">
            <span *ngIf="activeDocument.creator">{{ activeDocument.creator.firstName }} {{ activeDocument.creator.lastName }}</span>
          </div>
        </div>
      </div>

      <!-- Status badge -->
      <div class="mb-4">
        <ui-badge [variant]="getStatusBadgeVariant()">{{ activeDocument.status?.name || 'Created' }}</ui-badge>
      </div>

      <!-- Akcije -->
      <div class="flex items-center gap-2 pt-3 border-t border-border">
        <button (click)="viewDoc()" title="View"
                class="p-1.5 rounded text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>

        <button (click)="downloadDoc()" title="Download"
                class="p-1.5 rounded text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
        </button>

        <button *ngIf="activeDocument.statusID === 1" (click)="deleteDoc()" title="Delete"
                class="p-1.5 rounded text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>

        <!-- Submit za approval - samo ako ima approvalID i dokument je u statusu Created (1) -->
        <button *ngIf="approvalID && activeDocument.statusID === 1"
                (click)="submitForApproval()"
                [disabled]="isSubmitting"
                class="ml-auto inline-flex items-center px-3 py-1.5 rounded-md text-xs font-medium text-white bg-green-600 hover:bg-green-700 disabled:opacity-50 transition-colors">
          <svg *ngIf="!isSubmitting" class="w-3.5 h-3.5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <svg *ngIf="isSubmitting" class="animate-spin w-3.5 h-3.5 mr-1" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isSubmitting ? 'Submitting...' : 'Submit for Approval' }}
        </button>

        <!-- Nema approval poruka -->
        <span *ngIf="!approvalID && activeDocument.statusID === 1" class="ml-auto text-xs text-green-600 dark:text-green-400 font-medium">
          Document uploaded - step complete
        </span>
      </div>
    </div>

    <!-- Approval kartica -->
    <app-approval-card
      *ngIf="approval"
      [approval]="approval"
      (approvalUpdated)="onApprovalUpdated($event)"
      (allApprovalsCompleted)="onAllApproved($event)">
    </app-approval-card>

  </div>

  <!-- Inactive dokumenti - van activeDocument uslova, uvek vidljivi -->
  <div *ngIf="inactiveDocuments.length > 0" class="space-y-2 mt-3">
    <div class="text-xs font-medium text-muted-foreground uppercase tracking-wider mb-2">Previous Versions</div>
    <div *ngFor="let doc of inactiveDocuments"
         class="flex items-center gap-2 p-2 rounded border border-border bg-muted/20 text-sm">
      <svg class="w-4 h-4 text-muted-foreground flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
      <span class="truncate flex-1 text-muted-foreground">{{ doc.fileName }}</span>
      <button (click)="viewInactiveDoc(doc)" title="View"
              class="p-1 rounded text-muted-foreground hover:text-foreground transition-colors flex-shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      </button>
    </div>
  </div>
</div>
