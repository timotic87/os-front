<div class="w-full bg-background text-foreground p-6 rounded-lg" style="min-width: 600px;">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-primary/10">
      <svg class="h-5 w-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
    </div>
    <div>
      <h2 class="text-xl font-semibold text-foreground">Create Deal</h2>
      <p class="text-sm text-muted-foreground">Fill in the details to create a new deal</p>
    </div>
  </div>

  <div class="border-t border-border mb-6"></div>

  <form [formGroup]="createDealForm" autocomplete="off">

    <!-- Two Column Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

      <!-- Legal Entity -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-foreground">
          Legal Entity <span class="text-destructive">*</span>
        </label>
        <div class="relative">
          <select formControlName="legalEntity"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 appearance-none pr-8 cursor-pointer"
                  [ngClass]="createDealForm.get('legalEntity').touched && !createDealForm.get('legalEntity').valid ? 'border-destructive' : ''">
            <option [ngValue]="null" disabled>Select Legal Entity...</option>
            @for(le of listLe; track le){
              <option [ngValue]="le">{{ le.name }}</option>
            }
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-muted-foreground">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/>
            </svg>
          </div>
        </div>
        <div class="text-xs text-destructive" *ngIf="createDealForm.get('legalEntity').touched && !createDealForm.get('legalEntity').valid">
          Must select Legal Entity.
        </div>
      </div>

      <!-- Client -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-foreground">
          Client <span class="text-destructive">*</span>
        </label>
        <input type="text" formControlName="client" [matAutocomplete]="autoClient"
               class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
               [ngClass]="createDealForm.get('client').touched && !createDealForm.get('client').valid ? 'border-destructive' : ''"
               autocomplete="new-country" placeholder="Type to search clients...">
        <mat-autocomplete #autoClient="matAutocomplete">
          @for (client of currentClientList; track client){
            <mat-option [value]="client.customerName" (click)="onClientClick(client)">{{client.customerName}}</mat-option>
          }
        </mat-autocomplete>
        <div class="text-xs text-destructive" *ngIf="createDealForm.get('client').touched && !createDealForm.get('client').valid">
          Must select Client.
        </div>
      </div>

      <!-- Business Line -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-foreground">
          Business Line <span class="text-destructive">*</span>
        </label>
        <div class="relative">
          <select formControlName="service"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 appearance-none pr-8 cursor-pointer"
                  [ngClass]="createDealForm.get('service').touched && !createDealForm.get('service').valid ? 'border-destructive' : ''">
            <option [ngValue]="null" disabled>Select Business Line...</option>
            @for(service of SANDS.servicesForLe; track service){
              <option [ngValue]="service">{{ service.name }}</option>
            }
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-muted-foreground">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/>
            </svg>
          </div>
        </div>
        <div class="text-xs text-destructive" *ngIf="createDealForm.get('service').touched && !createDealForm.get('service').valid">
          Must select Business Line.
        </div>
      </div>

      <!-- Sub-line -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-foreground">
          Sub-line <span class="text-destructive">*</span>
        </label>
        <div class="relative">
          <select formControlName="subservice"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 appearance-none pr-8 cursor-pointer"
                  [ngClass]="createDealForm.get('subservice').touched && !createDealForm.get('subservice').valid ? 'border-destructive' : ''">
            <option [ngValue]="null" disabled>Select Sub-line...</option>
            @for(subservice of SANDS.subservicesForLe; track subservice){
              <option [ngValue]="subservice">{{ subservice.name }}</option>
            }
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-muted-foreground">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/>
            </svg>
          </div>
        </div>
        <div class="text-xs text-destructive" *ngIf="createDealForm.get('subservice').touched && !createDealForm.get('subservice').valid">
          Must select Sub-line.
        </div>
      </div>
    </div>

    <!-- BD Consultant - Full Width with Search Dropdown -->
    <div class="mt-4 space-y-2">
      <label class="text-sm font-medium text-foreground">
        BD Consultant <span class="text-destructive">*</span>
      </label>
      <div>
        <button type="button" [matMenuTriggerFor]="bdMenu"
                class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 items-center justify-between cursor-pointer"
                [ngClass]="createDealForm.get('bdUser').touched && !createDealForm.get('bdUser').valid ? 'border-destructive' : ''">
          <div class="flex items-center gap-2" *ngIf="selectedBdUser; else bdPlaceholder">
            @if(selectedBdUser.profilePicUrl) {
              <img class="w-6 h-6 rounded-full flex-shrink-0" [src]="selectedBdUser.profilePicUrl" alt="" style="object-fit: cover;">
            } @else {
              <div class="w-6 h-6 rounded-full bg-primary/10 flex items-center justify-center text-xs font-medium text-primary flex-shrink-0">
                {{ selectedBdUser.firstName?.charAt(0) }}{{ selectedBdUser.lastName?.charAt(0) }}
              </div>
            }
            <span class="text-foreground">{{ selectedBdUser.firstName }} {{ selectedBdUser.lastName }}</span>
          </div>
          <ng-template #bdPlaceholder>
            <span class="text-muted-foreground">Select BD Consultant...</span>
          </ng-template>
          <svg class="h-4 w-4 text-muted-foreground flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/>
          </svg>
        </button>

        <mat-menu #bdMenu="matMenu" class="bd-consultant-menu">
          <div class="px-3 py-2" (click)="$event.stopPropagation()">
            <input type="text" placeholder="Search users..."
                   class="w-full px-3 py-1.5 text-sm border border-border rounded-md bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
                   [(ngModel)]="bdSearch" [ngModelOptions]="{standalone: true}" (input)="filterBdUsers(bdSearch)">
          </div>
          <button mat-menu-item *ngFor="let user of filteredBdUsers" (click)="selectBdUser(user)">
            <div class="flex items-center gap-2">
              @if(user.profilePicUrl) {
                <img class="w-6 h-6 rounded-full" [src]="user.profilePicUrl" alt="" style="object-fit: cover;">
              } @else {
                <div class="w-6 h-6 rounded-full bg-primary/10 flex items-center justify-center text-xs font-medium text-primary">
                  {{ user.firstName?.charAt(0) }}{{ user.lastName?.charAt(0) }}
                </div>
              }
              <span>{{ user.firstName }} {{ user.lastName }}</span>
              <span *ngIf="selectedBdUser?.id === user.id" class="text-xs text-primary ml-auto">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </span>
            </div>
          </button>
          <div *ngIf="filteredBdUsers.length === 0" class="px-3 py-2 text-sm text-muted-foreground">
            No users found
          </div>
        </mat-menu>
      </div>
      <div class="text-xs text-destructive" *ngIf="createDealForm.get('bdUser').touched && !createDealForm.get('bdUser').valid">
        Must select BD Consultant.
      </div>
    </div>

    <!-- Comment -->
    <div class="mt-4 space-y-2">
      <label class="text-sm font-medium text-foreground">Comment</label>
      <textarea formControlName="comment" rows="3"
                class="flex w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 resize-none"
                placeholder="Add a comment (optional)..." autocomplete="new-name"></textarea>
    </div>

    <!-- Actions -->
    <div class="border-t border-border mt-6 pt-4">
      <div class="flex justify-end gap-3">
        <ui-button variant="outline" (onClick)="closeDialog()">
          Cancel
        </ui-button>
        <ui-button variant="default" (onClick)="createDeal()">
          <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Create Deal
        </ui-button>
      </div>
    </div>
  </form>
</div>
