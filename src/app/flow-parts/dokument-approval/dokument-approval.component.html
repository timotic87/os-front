<div class="pb-3">
  <ui-button
    (onClick)="openFileExplorer(fileInput)"
    [disabled]="documentService.activeDocument || !canAddNewDocument()"
    *ngIf="deal.flowStatus.ID >= statusIDShow"
    variant="default"
    size="default"
    className="my-5 mr-4 bg-[#386097] hover:bg-[#386097]/90 dark:bg-[#56BDED] dark:hover:bg-[#56BDED]/90">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    Add {{ type }} document
  </ui-button>
  <input type="file" #fileInput accept="application/pdf" style="display: none;" (change)="onFileSelected($event)">

  <div class="grid grid-cols-3 gap-2 w-full">
      <app-document-card [approvalID]="approvalID" *ngIf="documentService.activeDocument"></app-document-card>
    @if (docApproval){

      <app-approval-card 
        [approval]="docApproval"
        (approvalUpdated)="onApprovalUpdated($event)"
        (allApprovalsCompleted)="onAllApprovalsCompleted($event)">
      </app-approval-card>
    }

    <!-- Modern Card-Based Inactive Documents -->
    <div class="space-y-3">
      @for (doc of documentService.inactiveDocuments; track doc) {
        <app-inactive-document-card 
          [document]="doc"
          (viewDocument)="showInactiveDoc($event)"
          (downloadDocument)="downloadInactiveFile($event)"
          (openApproval)="openApprovalDialog($event)">
        </app-inactive-document-card>
      }
    </div>


  </div>

</div>
