<div class="w-full max-w-3xl mx-auto p-6">
  <div class="mb-6">
    <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">Create Contract Annex</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Modify contract terms and upload the signed annex document</p>
  </div>

  <form [formGroup]="annexForm" autocomplete="off" class="space-y-6">

    <!-- Reason & Effective Date -->
    <div class="bg-blue-50 dark:bg-blue-950/20 border border-blue-200 dark:border-blue-800 rounded-lg p-4">
      <h3 class="text-sm font-semibold text-blue-900 dark:text-blue-100 mb-3">Annex Details</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-1 md:col-span-2">
          <label class="text-xs font-medium text-blue-900 dark:text-blue-100">Reason for Annex*</label>
          <textarea formControlName="reason" rows="2"
                    class="block w-full rounded border-blue-300 dark:border-blue-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-2"
                    placeholder="e.g. Contract extension, fee change, etc."></textarea>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-blue-900 dark:text-blue-100">Effective Date*</label>
          <input type="date" formControlName="effectiveDate"
                 class="block w-full rounded border-blue-300 dark:border-blue-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 dark:[color-scheme:dark]">
        </div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4">
      <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-3">Project Timeline</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Start Date*</label>
          <input type="date" formControlName="startDate"
                 class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 dark:[color-scheme:dark]">
        </div>
        <div class="space-y-1" *ngIf="annexForm.get('isExpired').value">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">End Date</label>
          <input type="date" formControlName="endDate"
                 class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 dark:[color-scheme:dark]">
        </div>
        <div class="space-y-1 flex items-end">
          <div class="flex items-center space-x-2">
            <input formControlName="isExpired" id="annexCanExpire" type="checkbox"
                   class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            <label for="annexCanExpire" class="text-sm text-gray-700 dark:text-gray-300">Can expire</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Salary Fee -->
    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4" *ngIf="data.showSalaryFee !== false">
      <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-3">Salary Fee</h3>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Fee Type</label>
          <select formControlName="salaryFeeTypeID"
                  class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
            <option [ngValue]="null">-- None --</option>
            <option *ngFor="let ft of feeTypes" [ngValue]="ft.ID">{{ft.name}}</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Value</label>
          <input type="number" formControlName="fee_type_salary_value"
                 class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Currency</label>
          <select formControlName="salaryCurrencyID"
                  class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
            <option [ngValue]="null">-- None --</option>
            <option *ngFor="let c of currencyList" [ngValue]="c.ID">{{c.code}}</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Payment Due (days)</label>
          <input type="number" formControlName="payment_due_on_salary"
                 class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
        </div>
      </div>
    </div>

    <!-- Cost Fee (only for stuffing flow) -->
    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4" *ngIf="data.showCostFee">
      <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-3">Cost Fee</h3>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Fee Type</label>
          <select formControlName="costFeeTypeID"
                  class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
            <option [ngValue]="null">-- None --</option>
            <option *ngFor="let ft of feeTypes" [ngValue]="ft.ID">{{ft.name}}</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Value</label>
          <input type="number" formControlName="fee_type_cost_value"
                 class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Currency</label>
          <select formControlName="costCurrencyID"
                  class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
            <option [ngValue]="null">-- None --</option>
            <option *ngFor="let c of currencyList" [ngValue]="c.ID">{{c.code}}</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Payment Due (days)</label>
          <input type="number" formControlName="payment_due_on_cost"
                 class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
        </div>
      </div>
    </div>

    <!-- Annex Document Upload -->
    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4">
      <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-3">Annex Document</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">Upload PDF</label>
          <input type="file" accept=".pdf" (change)="onFileSelected($event)"
                 class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-blue-900/30 dark:file:text-blue-300">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-700 dark:text-gray-300">File Name</label>
          <input type="text" formControlName="fileName"
                 class="block w-full rounded border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm h-10 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100"
                 placeholder="Annex file name">
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-2">
      <button type="button" (click)="close()"
              class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
        Cancel
      </button>
      <button type="button" (click)="save()"
              class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 transition-colors">
        Create Annex
      </button>
    </div>
  </form>
</div>
