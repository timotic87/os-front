<div class="min-h-screen flex">
  <!-- Left: Welcome Section - Dark Background -->
  <div class="hidden lg:flex lg:w-1/2 bg-slate-900 dark:bg-slate-950 relative overflow-hidden">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
      <svg class="w-full h-full" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="white" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100" height="100" fill="url(#grid)" />
      </svg>
    </div>

    <!-- Decorative circles -->
    <div class="absolute top-20 left-20 w-32 h-32 bg-blue-500/20 rounded-full blur-xl"></div>
    <div class="absolute bottom-32 right-16 w-24 h-24 bg-purple-500/20 rounded-full blur-xl"></div>

    <!-- Welcome Content -->
    <div class="relative z-10 flex flex-col justify-center px-12 py-12">
      <div class="max-w-md">
        <!-- Light logo for dark background -->
        <div class="mb-8">
          <img src="assets/onespot_left.svg" alt="OneSpot" class="h-36 w-auto">
        </div>

        <p class="text-lg text-slate-300 mb-8">
          Your centralized platform for managing projects, clients and finances.
        </p>

        <!-- Features -->
        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-2 h-2 rounded-full bg-orange-400"></div>
            <span class="text-sm text-slate-400">Client Management</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-2 h-2 rounded-full bg-orange-400"></div>
            <span class="text-sm text-slate-400">Project Tracking</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-2 h-2 rounded-full bg-orange-400"></div>
            <span class="text-sm text-slate-400">Financial Overview</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: Login Form -->
  <div class="flex-1 flex items-center justify-center px-6 py-12 lg:px-8 bg-background">
    <div class="w-full max-w-sm space-y-8">

      <!-- Logo above form (both mobile and desktop) -->
      <div class="flex flex-col items-center text-center">
        <img src="assets/onespot_login.svg" alt="OneSpot" class="h-80 w-auto dark:hidden">
        <img src="assets/onespot_login_light.svg" alt="OneSpot" class="h-80 w-auto hidden dark:block">
        <p class="text-sm font-medium text-muted-foreground mt-2">Built for <span class="font-semibold text-foreground">Manpower</span></p>
      </div>

      <!-- Form Header -->
      <div class="text-center">
        <h2 class="text-2xl font-bold text-foreground">Sign In</h2>
        <p class="text-muted-foreground mt-1 text-sm">Enter your credentials to access the system</p>
      </div>

      <!-- Error Alert -->
      <ui-alert *ngIf="loginError" variant="destructive" class="mb-4">
        <ui-alert-description>
          {{ loginError }}
        </ui-alert-description>
      </ui-alert>

      <!-- Login Form -->
      <form [formGroup]="loginForm" class="space-y-6">
        <!-- Username Field -->
        <ui-input
          label="Username"
          type="text"
          placeholder="Enter your username"
          [required]="true"
          formControlName="username"
          [error]="getFieldError('username')">
        </ui-input>

        <!-- Password Field -->
        <ui-input
          label="Password"
          type="password"
          placeholder="Enter your password"
          [required]="true"
          formControlName="password"
          [error]="getFieldError('password')">
        </ui-input>

        <!-- Login Button -->
        <ui-button
          type="submit"
          size="lg"
          className="w-full"
          [disabled]="isLoading"
          (onClick)="login()">
          <div *ngIf="isLoading" class="flex items-center gap-2">
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="m4,12a8,8 0 0,1 8,-8V0C5.373,0 0,5.373 0,12h4zm2,5.291A7.962,7.962 0 0,1 4,12H0c0,3.042 1.135,5.824 3,7.938l3,-2.647z"></path>
            </svg>
            <span>Signing in...</span>
          </div>
          <span *ngIf="!isLoading">Sign In</span>
        </ui-button>
      </form>
    </div>
  </div>
</div>
