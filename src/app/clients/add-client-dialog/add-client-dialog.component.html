<div class="h-full w-full dark:bg-gray-600 py-9">
  <div class="pb-9 flex justify-center text-gray-400 dark:text-neutral-100">
    <h2 class="text-center text-2xl mt-3">Add client</h2>
  </div>
  <hr class="mb-9 h-0.5 border-t-0 bg-neutral-100 opacity-100 dark:opacity-50" />
  <form [formGroup]="addClientForm" autocomplete="off">
    <div class="flex flex-row">

      <div class="basis-2/4">
        <div class="flex justify-center text-gray-600 dark:text-gray-300">Customer Name:</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="text" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600"
                 [ngClass]="isInvalid('customerName') ? 'border-red-500':''" formControlName="customerName" autocomplete="new-name">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('customerName')">Customer name is required (min. 3 characters).</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">Registration No. (Company No.):</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="text" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600"
                 [ngClass]="isInvalid('registrationNo') ? 'border-red-500':''" formControlName="registrationNo" autocomplete="new-mb">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('registrationNo') && addClientForm.get('country')?.value === 'RS'">Registration number must be exactly 8 digits for Serbian clients.</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">VAT Registration No. (TIN):</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="text" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600"
                 [ngClass]="isInvalid('vatRegistrationNo') ? 'border-red-500':''" formControlName="vatRegistrationNo" autocomplete="new-pib">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('vatRegistrationNo') && addClientForm.get('country')?.value === 'RS'">VAT registration number must be exactly 9 digits for Serbian clients.</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">Email:</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="email" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600"
                 [ngClass]="isInvalid('email') ? 'border-red-500':''" formControlName="email" autocomplete="new-mail">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('email')">Must be a valid email format.</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">Email in Finance:</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="email" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600"
                 [ngClass]="isInvalid('emailInFinance') ? 'border-red-500':''" formControlName="emailInFinance" autocomplete="new-email-finance">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('emailInFinance')">Must be a valid email format.</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">Phone in Finance:</div>
        <div class="flex justify-center text-gray-400 mb-3 dark:text-neutral-100">
          <input type="text" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600"
                 formControlName="phoneInFinance" autocomplete="new-phone-finance">
        </div>

      </div>
      <div class="basis-2/4">
        <div class="flex justify-center text-gray-600 dark:text-gray-300">Zip Code:</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100 relative">
          <div class="w-3/4 relative">
            <input type="text" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600"
                   [ngClass]="isInvalid('zipCode') ? 'border-red-500':''" formControlName="zipCode" autocomplete="new-zipCode"
                   [matAutocomplete]="autoZip">
            <mat-autocomplete #autoZip="matAutocomplete">
              @for (pc of postCodeResults; track pc.id) {
                <mat-option [value]="pc.zipCode" (click)="onPostCodeSelect(pc)" class="bg-white dark:bg-gray-600">
                  {{pc.zipCode}} - {{pc.city}} ({{pc.country}})
                </mat-option>
              }
            </mat-autocomplete>
          </div>
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('zipCode')">Zip code is required (min. 4 characters).</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">City:</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="text" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600" formControlName="city" autocomplete="new-city"
                 [ngClass]="isInvalid('city') ? 'border-red-500':''">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('city')">City is required (min. 2 characters).</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">Country (ISO code):</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="text" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600 uppercase" formControlName="country" autocomplete="new-country"
                 [ngClass]="isInvalid('country') ? 'border-red-500':''" maxlength="10" placeholder="e.g. RS, DE, AT">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('country')">Country ISO code is required (e.g. RS, DE, AT).</label>

        <div class="flex justify-center text-gray-600 dark:text-gray-300">Address:</div>
        <div class="flex justify-center text-gray-400 mb-1 dark:text-neutral-100">
          <input type="text" class="w-3/4 border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 dark:bg-gray-600" formControlName="address" autocomplete="new-address"
                 [ngClass]="isInvalid('address') ? 'border-red-500':''">
        </div>
        <label class="text-xs text-red-500 block text-center mb-2" *ngIf="isInvalid('address')">Address is required (min. 5 characters).</label>

        <!-- currencyId - zakomentarisano, lako se vraca -->
        <!--
        <div class="flex justify-center text-gray-600 dark:text-gray-300">Invoice currency:</div>
        <div class="flex justify-center text-gray-400 mb-3 dark:text-neutral-100">
          <select formControlName="currencyId" type="text" class="rounded border block appearance-none w-3/4 bg-white border-gray-400 text-gray-400 mb-3 dark:text-neutral-100 py-2 px-4 pr-8 leading-tight focus:outline-none focus:bg-white dark:bg-gray-600">
            @for(currency of currencyService.getCurrencyList(); track currency){
              <option [value]="currency.id">{{ currency.name }}</option>
            }
          </select>
        </div>
        <label class="text-xs text-red-500 block text-center" *ngIf="isInvalid('currencyId')">Must select currency.</label>
        -->
      </div>
    </div>
    <hr class="my-9 h-0.5 border-t-0 bg-neutral-100 opacity-100 dark:opacity-50" />
    <div class="w-full flex flex-row-reverse pr-6">
      <button (click)="closeDialog();"
              type="button"
              class="inline-block rounded bg-red-500 px-6 pb-2 pt-2.5 text-xs font-medium uppercase leading-normal mr-4
       text-white shadow-[0_4px_9px_-4px_#dc4c64] transition duration-150 ease-in-out hover:bg-red-600
        hover:shadow-[0_8px_9px_-4px_rgba(220,76,100,0.3),0_4px_18px_0_rgba(220,76,100,0.2)] focus:bg-red-600
         focus:shadow-[0_8px_9px_-4px_rgba(220,76,100,0.3),0_4px_18px_0_rgba(220,76,100,0.2)] focus:outline-none
          focus:ring-0 active:bg-danger-700 active:shadow-[0_8px_9px_-4px_rgba(220,76,100,0.3),0_4px_18px_0_rgba(220,76,100,0.2)]
           dark:shadow-[0_4px_9px_-4px_rgba(220,76,100,0.5)] dark:hover:shadow-[0_8px_9px_-4px_rgba(220,76,100,0.2),0_4px_18px_0_rgba(220,76,100,0.1)]
            dark:focus:shadow-[0_8px_9px_-4px_rgba(220,76,100,0.2),0_4px_18px_0_rgba(220,76,100,0.1)] dark:active:shadow-[0_8px_9px_-4px_rgba(220,76,100,0.2),0_4px_18px_0_rgba(220,76,100,0.1)]">
        Close
      </button>
        <button (click)="addClient();"
                type="button"
                class="inline-block rounded bg-[#386097] px-6 pb-2 pt-2.5 text-xs font-medium uppercase mx-4
      leading-normal text-white shadow-[0_4px_9px_-4px_#54b4d3] transition duration-150 dark:bg-[#56BDED]
      ease-in-out hover:bg-info-600 hover:shadow-[0_8px_9px_-4px_rgba(84,180,211,0.3),0_4px_18px_0_rgba(84,180,211,0.2)] focus:bg-info-600
      focus:shadow-[0_8px_9px_-4px_rgba(84,180,211,0.3),0_4px_18px_0_rgba(84,180,211,0.2)] focus:outline-none focus:ring-0
      active:bg-info-700 active:shadow-[0_8px_9px_-4px_rgba(84,180,211,0.3),0_4px_18px_0_rgba(84,180,211,0.2)]
      dark:shadow-[0_4px_9px_-4px_rgba(84,180,211,0.5)] dark:hover:shadow-[0_8px_9px_-4px_rgba(84,180,211,0.2),0_4px_18px_0_rgba(84,180,211,0.1)]
      dark:focus:shadow-[0_8px_9px_-4px_rgba(84,180,211,0.2),0_4px_18px_0_rgba(84,180,211,0.1)] dark:active:shadow-[0_8px_9px_-4px_rgba(84,180,211,0.2),0_4px_18px_0_rgba(84,180,211,0.1)]">
          Add Client
        </button>

    </div>
  </form>
</div>
