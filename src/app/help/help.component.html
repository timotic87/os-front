<div class="container mx-auto px-4 py-6 pt-24 max-w-4xl">

  <!-- Header -->
  <div class="mb-8">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-semibold text-foreground flex items-center gap-2">
          <svg class="h-6 w-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          {{ t.title }}
        </h1>
        <p class="mt-1 text-sm text-muted-foreground">{{ t.subtitle }}</p>
      </div>

      <div class="flex items-center gap-2">
        <!-- Language switch -->
        <div class="flex items-center rounded-md border border-input overflow-hidden text-xs font-medium">
          <button (click)="lang = 'sr'"
                  [class]="lang === 'sr' ? 'px-3 py-1.5 bg-primary text-primary-foreground' : 'px-3 py-1.5 bg-background text-muted-foreground hover:text-foreground hover:bg-muted transition-colors'">
            SR
          </button>
          <button (click)="lang = 'en'"
                  [class]="lang === 'en' ? 'px-3 py-1.5 bg-primary text-primary-foreground' : 'px-3 py-1.5 bg-background text-muted-foreground hover:text-foreground hover:bg-muted transition-colors'">
            EN
          </button>
        </div>

        <button (click)="expandAll()"
                class="inline-flex items-center h-8 px-3 rounded-md text-xs font-medium border border-input bg-background text-muted-foreground hover:text-foreground hover:bg-accent transition-colors">
          {{ t.expandAll }}
        </button>
        <button (click)="collapseAll()"
                class="inline-flex items-center h-8 px-3 rounded-md text-xs font-medium border border-input bg-background text-muted-foreground hover:text-foreground hover:bg-accent transition-colors">
          {{ t.collapseAll }}
        </button>
      </div>
    </div>
  </div>

  <!-- Sections -->
  <div class="space-y-3">
    @for (section of sections; track section.id) {
      <div class="rounded-lg border border-border bg-card overflow-hidden">

        <!-- Section Header -->
        <button (click)="toggle(section)"
                class="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-muted/50 transition-colors">
          <div class="flex items-center gap-3">
            <svg class="h-5 w-5 shrink-0" [ngClass]="section.color" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="section.icon"/>
            </svg>
            <span class="font-medium text-foreground">{{ section[lang].title }}</span>
          </div>
          <svg class="h-4 w-4 text-muted-foreground transition-transform duration-200"
               [class.rotate-180]="section.open"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Section Content -->
        @if (section.open) {
          <div class="px-5 pb-5 border-t border-border">
            <div class="pt-4 grid gap-5 sm:grid-cols-2">
              @for (sub of section.subsections; track $index) {
                <div>
                  <h3 class="text-sm font-semibold text-foreground mb-2 flex items-center gap-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-primary shrink-0"></span>
                    {{ sub[lang].title }}
                  </h3>
                  <ul class="space-y-1.5">
                    @for (line of sub[lang].content; track $index) {
                      <li class="flex items-start gap-2 text-sm text-muted-foreground">
                        <svg class="h-3.5 w-3.5 mt-0.5 shrink-0 text-muted-foreground/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                        <span>{{ line }}</span>
                      </li>
                    }
                  </ul>
                </div>
              }
            </div>
          </div>
        }

      </div>
    }
  </div>

  <p class="mt-8 text-center text-xs text-muted-foreground">{{ t.footer }}</p>

</div>
