<div class="w-full bg-background text-foreground p-6 rounded-lg max-h-[85vh] overflow-y-auto">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-primary/10">
      <svg class="h-5 w-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
      </svg>
    </div>
    <div>
      <h2 class="text-xl font-semibold text-foreground">User Permissions</h2>
      <p class="text-sm text-muted-foreground">Manage permissions for {{ user.fullName }}</p>
    </div>
  </div>

  <div class="border-t border-border mb-6"></div>

  <!-- Template Quick Apply -->
  <div class="flex items-center gap-3 mb-6 p-3 rounded-lg bg-muted/50 border border-border">
    <svg class="h-4 w-4 text-muted-foreground shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>
    </svg>
    <select [(ngModel)]="selectedTemplateId" class="flex-1 h-8 px-2 rounded-md border border-input bg-background text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-ring">
      <option [ngValue]="null">Select a template...</option>
      <option *ngFor="let t of templates" [ngValue]="t.id">{{ t.name }} ({{ t.permissionCount }} permissions)</option>
    </select>
    <button type="button" (click)="applyTemplate()" [disabled]="!selectedTemplateId"
            class="inline-flex items-center gap-1.5 px-3 h-8 rounded-md text-xs font-medium bg-primary text-primary-foreground hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:pointer-events-none">
      Apply Template
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div formArrayName="checkboxes">
      <div *ngFor="let permArr of arrayOfArrays; let i = index" class="mb-6">
        <!-- Section Header -->
        <h3 class="text-sm font-semibold text-foreground mb-3 flex items-center gap-2">
          <svg class="h-4 w-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
          {{ permArr[0].sectionName }}
        </h3>
        <!-- Permissions Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 ml-6">
          <div *ngFor="let perm of permArr" class="flex items-center gap-2.5 py-1.5">
            <input
              type="checkbox"
              [formControlName]="perm._index"
              (change)="onChange(perm)"
              class="h-4 w-4 rounded border-input text-primary focus:ring-ring focus:ring-offset-background cursor-pointer accent-primary">
            <label class="text-sm text-foreground cursor-pointer select-none">
              {{ perm.name }}
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="border-t border-border mt-6 pt-4">
      <div class="flex justify-end gap-3">
        <ui-button variant="outline" (onClick)="closeDialog()">
          Cancel
        </ui-button>
        <ui-button variant="default" (onClick)="onSubmit()">
          <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Save Permissions
        </ui-button>
      </div>
    </div>
  </form>

  <!-- Entity Access Section -->
  <div class="border-t border-border mt-6 pt-6">
    <h3 class="text-lg font-semibold text-foreground mb-4 flex items-center gap-2">
      <svg class="h-5 w-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
      </svg>
      Entity Access
    </h3>

    <!-- Existing entity accesses table -->
    <div *ngIf="entityAccesses.length > 0" class="mb-4 overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-border">
            <th class="text-left py-2 px-3 text-muted-foreground font-medium">Entity Type</th>
            <th class="text-left py-2 px-3 text-muted-foreground font-medium">Entity ID</th>
            <th class="text-left py-2 px-3 text-muted-foreground font-medium">Access Level</th>
            <th class="text-right py-2 px-3 text-muted-foreground font-medium">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let access of entityAccesses" class="border-b border-border/50 hover:bg-muted/50">
            <td class="py-2 px-3">{{ access.entityType }}</td>
            <td class="py-2 px-3">{{ access.entityId }}</td>
            <td class="py-2 px-3">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                    [class]="access.accessLevel === 'edit' ? 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200' : 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200'">
                {{ access.accessLevel }}
              </span>
            </td>
            <td class="py-2 px-3 text-right">
              <button (click)="revokeAccess(access)"
                      class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-xs font-medium text-destructive hover:bg-destructive/10 transition-colors">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                Revoke
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <p *ngIf="entityAccesses.length === 0" class="text-sm text-muted-foreground mb-4">No entity access records for this user.</p>

    <!-- Grant access form -->
    <div class="flex items-end gap-3 p-3 rounded-lg bg-muted/50 border border-border">
      <div class="flex-1">
        <label class="block text-xs font-medium text-muted-foreground mb-1">Entity Type</label>
        <select [(ngModel)]="newAccess.entityType"
                class="w-full h-8 px-2 rounded-md border border-input bg-background text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-ring">
          <option *ngFor="let t of entityTypes" [value]="t">{{ t }}</option>
        </select>
      </div>
      <div class="flex-1">
        <label class="block text-xs font-medium text-muted-foreground mb-1">Entity ID</label>
        <input type="number" [(ngModel)]="newAccess.entityId" placeholder="ID"
               class="w-full h-8 px-2 rounded-md border border-input bg-background text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-ring">
      </div>
      <div class="flex-1">
        <label class="block text-xs font-medium text-muted-foreground mb-1">Access Level</label>
        <select [(ngModel)]="newAccess.accessLevel"
                class="w-full h-8 px-2 rounded-md border border-input bg-background text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-ring">
          <option *ngFor="let l of accessLevels" [value]="l">{{ l }}</option>
        </select>
      </div>
      <button (click)="grantAccess()" [disabled]="!newAccess.entityId"
              class="inline-flex items-center gap-1.5 px-3 h-8 rounded-md text-xs font-medium bg-primary text-primary-foreground hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:pointer-events-none">
        Grant
      </button>
    </div>
  </div>
</div>
