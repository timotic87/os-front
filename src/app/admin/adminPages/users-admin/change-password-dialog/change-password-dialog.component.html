<div class="w-full bg-background text-foreground p-6 rounded-lg" style="min-width: 400px;">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-primary/10">
      <svg class="h-5 w-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"/>
      </svg>
    </div>
    <div>
      <h2 class="text-xl font-semibold text-foreground">{{ title }}</h2>
      <p class="text-sm text-muted-foreground">Enter a new password</p>
    </div>
  </div>

  <div class="border-t border-border mb-6"></div>

  <form [formGroup]="changePassForm" autocomplete="off">
    <div class="space-y-2">
      <label class="text-sm font-medium text-foreground">New Password <span class="text-destructive">*</span></label>
      <input type="password" formControlName="password" autocomplete="new-password"
             class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
             [ngClass]="changePassForm.get('password').touched && !changePassForm.get('password').valid ? 'border-destructive' : ''"
             placeholder="Minimum 6 characters">
      <div class="text-xs text-destructive" *ngIf="changePassForm.get('password').touched && !changePassForm.get('password').valid">
        Password needs to be minimum 6 characters long.
      </div>
    </div>

    <!-- Actions -->
    <div class="border-t border-border mt-6 pt-4">
      <div class="flex justify-end gap-3">
        <ui-button variant="outline" (onClick)="closeDialog()">
          Cancel
        </ui-button>
        <ui-button variant="default" (onClick)="resetPass()">
          <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Change Password
        </ui-button>
      </div>
    </div>
  </form>
</div>
