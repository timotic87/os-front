<ui-card>
  <ui-card-header>
    <div class="flex items-center justify-between w-full">
      <ui-card-title class="flex items-center gap-2">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Approval Templates
      </ui-card-title>
    </div>
  </ui-card-header>
  <ui-card-content>
    <div class="rounded-md border border-border overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-border bg-muted/50">
            <th class="h-9 px-3 text-left font-medium text-muted-foreground">ID</th>
            <th class="h-9 px-3 text-left font-medium text-muted-foreground">Name</th>
            <th class="h-9 px-3 text-center font-medium text-muted-foreground">Sequential</th>
          </tr>
        </thead>
        <tbody>
          @for (approval of approvals; track approval) {
            <tr class="border-b border-border hover:bg-muted/30 transition-colors cursor-pointer"
                (click)="onTemplateCliclk(approval)">
              <td class="px-3 py-2.5 font-medium text-primary">{{ approval.ID }}</td>
              <td class="px-3 py-2.5 text-foreground">{{ approval.name }}</td>
              <td class="px-3 py-2.5 text-center">
                @if (approval.isSequential) {
                  <span class="inline-flex items-center rounded-full bg-primary/10 px-2 py-0.5 text-xs font-medium text-primary">Yes</span>
                } @else {
                  <span class="inline-flex items-center rounded-full bg-muted px-2 py-0.5 text-xs font-medium text-muted-foreground">No</span>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </ui-card-content>
</ui-card>
