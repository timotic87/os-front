<ui-card>
  <ui-card-header>
    <div class="flex items-center justify-between w-full">
      <ui-card-title class="flex items-center gap-2">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Approval Templates
      </ui-card-title>
      <button (click)="toggleCreateForm()"
              class="inline-flex items-center justify-center rounded-md text-sm font-medium h-8 px-3 bg-primary text-primary-foreground hover:bg-primary/90 transition-colors">
        @if (showCreateForm) {
          Cancel
        } @else {
          + New Template
        }
      </button>
    </div>
  </ui-card-header>
  <ui-card-content>

    <!-- Create Form -->
    @if (showCreateForm) {
      <div class="mb-4 p-4 rounded-md border border-border bg-muted/30">
        <h3 class="text-sm font-semibold mb-3">Create New Approval Template</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
          <div>
            <label class="block text-xs font-medium text-muted-foreground mb-1">Name *</label>
            <input [(ngModel)]="newName" placeholder="Template name"
                   class="w-full rounded-md border border-input bg-background px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-ring" />
          </div>
          <div>
            <label class="block text-xs font-medium text-muted-foreground mb-1">Description</label>
            <input [(ngModel)]="newDescription" placeholder="Optional description"
                   class="w-full rounded-md border border-input bg-background px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-ring" />
          </div>
          <div>
            <label class="block text-xs font-medium text-muted-foreground mb-1">Sequential</label>
            <select [(ngModel)]="newIsSequential"
                    class="w-full rounded-md border border-input bg-background px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-ring">
              <option [ngValue]="true">Yes (steps in order)</option>
              <option [ngValue]="false">No (parallel)</option>
            </select>
          </div>
        </div>
        <button (click)="createTemplate()"
                class="inline-flex items-center justify-center rounded-md text-sm font-medium h-8 px-4 bg-primary text-primary-foreground hover:bg-primary/90 transition-colors">
          Create
        </button>
      </div>
    }

    <!-- Search -->
    <div class="mb-4">
      <div class="relative w-72">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" [(ngModel)]="searchText" (ngModelChange)="applySearch()" placeholder="Search templates..."
               class="h-9 w-full pl-9 pr-8 rounded-md border border-input bg-background text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-ring"/>
        <button *ngIf="searchText" (click)="searchText = ''; applySearch()"
                class="absolute right-2 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="rounded-md border border-border overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-border bg-muted/50">
            <th class="h-9 px-3 text-left font-medium text-muted-foreground">ID</th>
            <th class="h-9 px-3 text-left font-medium text-muted-foreground">Name</th>
            <th class="h-9 px-3 text-center font-medium text-muted-foreground">Sequential</th>
            <th class="h-9 px-3 text-center font-medium text-muted-foreground w-16">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (approval of filteredApprovals; track approval) {
            <tr class="border-b border-border hover:bg-muted/30 transition-colors cursor-pointer"
                (click)="onTemplateCliclk(approval)">
              <td class="px-3 py-2.5 font-medium text-primary">{{ approval.ID }}</td>
              <td class="px-3 py-2.5 text-foreground">{{ approval.name }}</td>
              <td class="px-3 py-2.5 text-center">
                @if (approval.isSequential) {
                  <span class="inline-flex items-center rounded-full bg-primary/10 px-2 py-0.5 text-xs font-medium text-primary">Yes</span>
                } @else {
                  <span class="inline-flex items-center rounded-full bg-muted px-2 py-0.5 text-xs font-medium text-muted-foreground">No</span>
                }
              </td>
              <td class="px-3 py-2.5 text-center">
                <button (click)="deleteTemplate($event, approval)"
                        class="inline-flex items-center justify-center rounded-md h-7 w-7 text-destructive hover:bg-destructive/10 transition-colors"
                        title="Delete template">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </ui-card-content>
</ui-card>
