<div
  class="group rounded-lg border px-4 py-3 transition-colors"
  [class]="notification.isRead ? 'border-border bg-background' : 'border-primary/20 bg-primary/5'">

  <!-- Top row: creator + date + actions -->
  <div class="flex items-center justify-between gap-2 mb-1.5">
    <div class="flex items-center gap-2 min-w-0">
      <span class="text-sm font-medium text-foreground truncate">{{ notification.creator?.firstname }} {{ notification.creator?.lastName }}</span>
      <span class="text-xs text-muted-foreground shrink-0">{{ notification.creationDate | date:'dd.MM.yyyy HH:mm' }}</span>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <!-- Flag toggle -->
      <button
        (click)="flaggedChange(notification.id); $event.stopPropagation()"
        class="p-1 rounded hover:bg-muted transition-colors"
        [class.text-amber-500]="notification.flagged"
        [class.text-muted-foreground]="!notification.flagged">
        @if (notification.flagged) {
          <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 3v18h2V13h14l-4-5 4-5H5V3H3z"/></svg>
        } @else {
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18m0-14h13l-3 4 3 4H5"/></svg>
        }
      </button>
      <!-- Mark as read -->
      @if (!notification.isRead) {
        <button
          (click)="changeIsRead(notification.id); $event.stopPropagation()"
          class="p-1 rounded text-muted-foreground hover:text-primary hover:bg-muted transition-colors"
          title="Mark as read">
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </button>
      }
      <!-- Delete -->
      <button
        (click)="deleteNotification(); $event.stopPropagation()"
        class="p-1 rounded text-muted-foreground hover:text-destructive hover:bg-destructive/10 transition-colors"
        title="Delete">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Message -->
  <p class="text-sm text-foreground/90 leading-relaxed">{{ notification.msg }}</p>

  <!-- Link (if exists) -->
  @if (notification.link) {
    <a (click)="navigateToLink()" class="inline-flex items-center gap-1 text-xs text-primary hover:underline mt-1.5 cursor-pointer">
      <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
      </svg>
      View details
    </a>
  }
</div>
