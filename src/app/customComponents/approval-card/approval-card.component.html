<!-- Compact Approval Card with optional inline mode -->
<div [ngClass]="inlineMode ? 'inline-block' : 'block'">
  <!-- Inline Badge Mode -->
  <div *ngIf="inlineMode" class="inline-flex items-center gap-2 px-3 py-1 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 rounded-full cursor-pointer transition-colors duration-200" (click)="toggleExpanded()">
    <svg class="h-3 w-3 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span class="text-xs font-medium text-gray-700 dark:text-gray-300">Approval</span>
    
    <!-- Quick Status Indicators -->
    <span class="text-green-600 dark:text-green-400 text-xs" *ngIf="getApprovedCount() > 0">{{getApprovedCount()}}✓</span>
    <span class="text-yellow-600 dark:text-yellow-400 text-xs" *ngIf="getPendingCount() > 0">{{getPendingCount()}}⏳</span>
    <span class="text-red-600 dark:text-red-400 text-xs" *ngIf="getDeclinedCount() > 0">{{getDeclinedCount()}}✗</span>
  </div>

  <!-- Standard Card Mode -->
  <div *ngIf="!inlineMode" class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm">
    <!-- Collapsible Header -->
    <div 
      class="flex items-center justify-between p-3 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 rounded-lg transition-colors duration-200"
      (click)="toggleExpanded()">
      
      <div class="flex items-center gap-2">
        <svg class="h-4 w-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h3 class="text-sm font-medium text-gray-900 dark:text-gray-100">Approval</h3>
        
        <!-- Status Summary -->
        <div class="flex items-center gap-1 ml-2">
          <!-- Approved count -->
          <span class="inline-flex items-center rounded-full px-2 py-1 text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/20 dark:text-green-400" *ngIf="getApprovedCount() > 0">
            {{getApprovedCount()}} ✓
          </span>
          
          <!-- Pending count -->
          <span class="inline-flex items-center rounded-full px-2 py-1 text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/20 dark:text-yellow-400" *ngIf="getPendingCount() > 0">
            {{getPendingCount()}} ⏳
          </span>
          
          <!-- Declined count -->
          <span class="inline-flex items-center rounded-full px-2 py-1 text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/20 dark:text-red-400" *ngIf="getDeclinedCount() > 0">
            {{getDeclinedCount()}} ✗
          </span>
        </div>
      </div>

      <!-- Expand/Collapse Icon -->
      <svg 
        class="h-4 w-4 text-gray-500 transition-transform duration-200" 
        [class.rotate-180]="isExpanded"
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </div>

  <!-- Expanded Content (works for both modes) -->
  <div class="mt-2" *ngIf="isExpanded">
    <div class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm p-3 space-y-3">
      @for (step of approval.steps; track step; let idx = $index) {
        <div class="mb-2 last:mb-0">
          <app-approval-step-card 
            [approval]="approval" 
            [stepIndex]="idx"
            (approvalChanged)="onApprovalChanged($event)"
            (approvalCompleted)="onApprovalCompleted($event)"></app-approval-step-card>
        </div>
      }
    </div>
  </div>
</div>
