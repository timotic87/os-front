<div class="flex flex-col" style="min-width: 480px; max-width: 90vw;">

  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-border">
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center justify-center h-8 w-8 rounded-full bg-amber-100 dark:bg-amber-900/40">
        <svg class="h-4 w-4 text-amber-700 dark:text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </span>
      <div>
        <h2 class="text-base font-semibold text-foreground">Message to Finance</h2>
        <p class="text-xs text-muted-foreground mt-0.5">
          @if (data.invoiceNo) { Invoice {{ data.invoiceNo }} · } Internal note, not sent to BC
        </p>
      </div>
    </div>
    <button (click)="dialogRef.close()" class="text-muted-foreground hover:text-foreground transition-colors">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="px-6 py-5 overflow-y-auto" style="max-height: 70vh;">
    <div class="text-sm text-foreground whitespace-pre-wrap break-words">{{ data.message }}</div>
  </div>

  <!-- Footer -->
  <div class="flex justify-end px-6 py-3 border-t border-border">
    <button type="button" (click)="dialogRef.close()"
            class="inline-flex items-center h-9 px-4 rounded-md text-sm font-medium border border-input bg-background text-foreground hover:bg-accent transition-colors">
      Close
    </button>
  </div>

</div>
