<div style="padding: 24px; min-width: 400px;">

  <!-- Header -->
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
    <svg style="width: 20px; height: 20px; flex-shrink: 0;"
         [style.color]="data.noteType === 'credit' ? '#7c3aed' : '#d97706'"
         fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <div>
      <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: hsl(var(--foreground));">
        {{ title }}
      </h3>
      <p style="margin: 4px 0 0; font-size: 12px; color: hsl(var(--muted-foreground));">
        From invoice RI-{{ data.invoice.ID }}
        <span *ngIf="data.invoice.candidate_first_name"> · {{ data.invoice.candidate_first_name }} {{ data.invoice.candidate_last_name }}</span>
      </p>
    </div>
  </div>

  <form [formGroup]="form">

    <!-- Fee Amount -->
    <div style="margin-bottom: 24px;">
      <label style="display: block; font-size: 13px; font-weight: 500; color: hsl(var(--foreground)); margin-bottom: 6px;">
        Fee Amount
      </label>
      <input formControlName="finalFeeAmount"
             type="number"
             min="0"
             step="0.001"
             style="width: 100%; height: 38px; padding: 0 12px; border-radius: 6px; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 14px; box-sizing: border-box;" />
      <p style="margin: 4px 0 0; font-size: 11px; color: hsl(var(--muted-foreground));">
        Original: {{ data.invoice.final_fee_amount | number:'1.2-2' }} {{ data.invoice.feeCurrency?.code || '' }}
      </p>
    </div>

    <!-- Ref. Invoice No. -->
    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 13px; font-weight: 500; color: hsl(var(--foreground)); margin-bottom: 6px;">
        Ref. Invoice No. <span style="font-weight: 400; color: hsl(var(--muted-foreground));">(optional, max 20)</span>
      </label>
      <input formControlName="refInvoiceNo" type="text" maxlength="20" placeholder="Posted BC invoice number..."
             style="width: 100%; height: 38px; padding: 0 12px; border-radius: 6px; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 14px; box-sizing: border-box;" />
      <p style="margin: 4px 0 0; font-size: 11px; color: hsl(var(--muted-foreground));">Required before sending to BC</p>
    </div>

    <!-- Actions -->
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button type="button" (click)="dialogRef.close()"
              style="height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid hsl(var(--border)); background: transparent; color: hsl(var(--foreground)); font-size: 14px; cursor: pointer;">
        Cancel
      </button>
      <button type="button" (click)="save()" [disabled]="saving || form.invalid"
              [style.background]="data.noteType === 'credit' ? '#7c3aed' : '#d97706'"
              style="height: 36px; padding: 0 16px; border-radius: 6px; border: none; color: #fff; font-size: 14px; cursor: pointer;"
              [style.opacity]="(saving || form.invalid) ? '0.6' : '1'">
        {{ saving ? 'Creating...' : title }}
      </button>
    </div>

  </form>
</div>
