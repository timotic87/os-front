<div class="w-full min-h-screen bg-background text-foreground">
  @if(link !== '/login' && link!=='/'){
    <app-navbar></app-navbar>
  }
  @if(link !== '/login' && link!=='/'){
    <!-- Notification Sidebar -->
    <div class="sidenav border-l border-border bg-background shadow-2xl" [ngClass]="shownotBar ? 'show' : ''">

      <!-- Header -->
      <div class="flex items-center justify-between px-5 pt-20 pb-4 border-b border-border">
        <div class="flex items-center gap-2">
          <h2 class="text-lg font-semibold text-foreground">Notifications</h2>
          @if (unreadCount > 0) {
            <span class="inline-flex items-center rounded-full bg-primary/10 px-2 py-0.5 text-xs font-medium text-primary">
              {{ unreadCount }}
            </span>
          }
        </div>
        <button
          (click)="closeNotifications()"
          class="p-1.5 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Actions bar -->
      @if (notificationList.length > 0) {
        <div class="flex items-center gap-2 px-5 py-2 border-b border-border">
          <button
            (click)="markAllAsRead()"
            class="text-xs text-primary hover:underline font-medium">
            Mark all as read
          </button>
          <span class="text-muted-foreground">|</span>
          <button
            (click)="deleteAllNotification(); $event.stopPropagation()"
            class="text-xs text-destructive hover:underline font-medium">
            Clear all
          </button>
        </div>
      }

      <!-- Notification list -->
      <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2">
        @for (notification of notificationList; track notification.id) {
          <app-notification-card [notification]="notification"></app-notification-card>
        } @empty {
          <div class="flex flex-col items-center justify-center py-16 text-center">
            <svg class="h-12 w-12 text-muted-foreground/30 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
            </svg>
            <p class="text-sm text-muted-foreground">No notifications</p>
            <p class="text-xs text-muted-foreground/70 mt-1">You're all caught up!</p>
          </div>
        }
      </div>

    </div>
  }
  <router-outlet></router-outlet>
</div>
