<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;700&amp;display=swap');
    .wm { font-family: 'DM Sans', 'Helvetica Neue', Helvetica, sans-serif; }
  </style>

  <!-- White background -->
  <rect width="680" height="520" fill="#ffffff"/>

  <!-- App icon rounded square -->
  <rect x="190" y="20" width="300" height="300" rx="68" fill="#0D1B2A"/>
  <rect x="190" y="20" width="300" height="300" rx="68" fill="none" stroke="#FF5A3C" stroke-width="1.5" opacity="0.18"/>

  <!-- Location pin -->
  <path d="M 340 278 C 296 260 280 218 282 154 A 58 58 0 0 0 398 154 C 400 218 384 260 340 278 Z" fill="#FF5A3C"/>
  <circle cx="340" cy="154" r="24" fill="#0D1B2A"/>
  <circle cx="340" cy="154" r="8" fill="#FF5A3C"/>

  <!-- Pulse rings -->
  <circle cx="340" cy="278" r="12" fill="none" stroke="#FF5A3C" stroke-width="1.5" opacity="0.35"/>
  <circle cx="340" cy="278" r="22" fill="none" stroke="#FF5A3C" stroke-width="1" opacity="0.18"/>

  <!-- Wordmark -->
  <text x="252" y="390" class="wm" font-size="56" font-weight="300" fill="#0D1B2A" letter-spacing="-1">One</text>
  <text x="364" y="390" class="wm" font-size="56" font-weight="700" fill="#FF5A3C" letter-spacing="-1">Spot</text>

  <!-- Tagline -->
  <text x="340" y="428" text-anchor="middle" class="wm" font-size="13" font-weight="300" fill="#FF5A3C" letter-spacing="4" opacity="0.75">EVERYTHING IN ONE PLACE</text>
  <line x1="230" y1="440" x2="450" y2="440" stroke="#FF5A3C" stroke-width="0.75" opacity="0.3"/>

  <!-- App icon preview (dark) -->
  <rect x="60" y="430" width="64" height="64" rx="14" fill="#0D1B2A"/>
  <path d="M 92 484 C 80 479 76 469 76 454 A 16 16 0 0 0 108 454 C 108 469 104 479 92 484 Z" fill="#FF5A3C"/>
  <circle cx="92" cy="454" r="6.5" fill="#0D1B2A"/>
  <circle cx="92" cy="454" r="2.2" fill="#FF5A3C"/>
  <text x="92" y="508" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#888888">app icon</text>

  <!-- App icon preview (light) -->
  <rect x="558" y="430" width="64" height="64" rx="14" fill="#FFF0EE"/>
  <path d="M 590 484 C 578 479 574 469 574 454 A 16 16 0 0 0 606 454 C 606 469 602 479 590 484 Z" fill="#FF5A3C"/>
  <circle cx="590" cy="454" r="6.5" fill="#FFF0EE"/>
  <circle cx="590" cy="454" r="2.2" fill="#FF5A3C"/>
  <text x="590" y="508" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#888888">light variant</text>
</svg>
