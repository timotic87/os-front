<svg width="220" height="155" viewBox="0 0 220 155" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon rounded square - krem bela kao light varijanta u brand SVG -->
  <rect x="60" y="5" width="100" height="100" rx="22" fill="#FFF0EE"/>

  <!-- Location pin -->
  <path d="M 110 93 C 91 85 85 69 86 47 A 24 24 0 0 0 134 47 C 135 69 129 85 110 93 Z" fill="#FF5A3C"/>
  <circle cx="110" cy="47" r="10" fill="#FFF0EE"/>
  <circle cx="110" cy="47" r="3.5" fill="#FF5A3C"/>

  <!-- Pulse rings -->
  <circle cx="110" cy="93" r="5" fill="none" stroke="#FF5A3C" stroke-width="1.2" opacity="0.5"/>
  <circle cx="110" cy="93" r="9" fill="none" stroke="#FF5A3C" stroke-width="0.8" opacity="0.3"/>

  <!-- Wordmark - beli "One", narandzasti "Spot" -->
  <text text-anchor="middle" x="110" y="143" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" letter-spacing="-0.5">
    <tspan font-weight="300" fill="#ffffff">One</tspan><tspan font-weight="700" fill="#FF5A3C">Spot</tspan>
  </text>
</svg>
